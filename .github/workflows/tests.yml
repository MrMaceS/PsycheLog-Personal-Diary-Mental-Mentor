name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      ENVIRONMENT: test
      DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://app_user:app_password@localhost:5432/psychelog_test
      REDIS_URL: redis://localhost:6379/0
      RABBITMQ_URL: amqp://app_user:app_password@localhost:5672/app_vhost
      JWT_SECRET_KEY: ci-test-jwt-secret
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "15"
      REFRESH_TOKEN_EXPIRE_DAYS: "30"
      PIN_MAX_ATTEMPTS: "4"
      PIN_FREEZE_AFTER_ATTEMPTS: "3"
      PIN_FREEZE_MINUTES: "10"
      OTP_EXPIRE_MINUTES: "10"
      OTP_MAX_REQUESTS_PER_HOUR: "5"
      OTP_MAX_VERIFY_ATTEMPTS: "3"
      S3_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY: ci-test-access
      S3_SECRET_KEY: ci-test-secret
      S3_BUCKET: ci-test-bucket
      S3_REGION: us-east-1
      ENCRYPTION_MASTER_KEY: 0123456789abcdef0123456789abcdef
      LOG_LEVEL: INFO

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: app_user
          POSTGRES_PASSWORD: app_password
          POSTGRES_DB: psychelog_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U app_user -d psychelog_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run migrations
        run: alembic upgrade head

      - name: Run tests
        run: python -m pytest --cov=app --cov-report=term-missing --cov-fail-under=90